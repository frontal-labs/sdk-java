name: Publish to Maven Central
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Confirm the version in build.gradle.kts is ready to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: ${{ inputs.confirm_version == '1.0.0' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Verify release
        run: gradle --no-daemon spotlessCheck assemble lint test examplesTest docsTest checkContracts
      - name: Publish signed artifacts to the Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepository
