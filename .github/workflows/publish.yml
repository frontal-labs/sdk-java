name: Publish to Maven Central
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag produced by release-please
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: maven-central-${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_call' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify release
        run: ./gradlew --no-daemon spotlessCheck assemble lint test examplesTest docsTest checkContracts
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          output-file: frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "frontal-sdk-${RELEASE_TAG}.spdx.json" --clobber
      - name: Attest published SDK artifacts and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            core/build/libs/*.jar
            services/build/libs/*.jar
            sdk/build/libs/frontal-sdk-*.jar
            frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
          sbom-path: frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
      - name: Publish signed artifacts to the Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepository
