name: Publish to Maven Central
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag produced by release-please
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: maven-central-${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_call' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Verify release
        run: ./gradlew --no-daemon spotlessCheck assemble lint test examplesTest docsTest checkContracts
      - name: Publish signed artifacts to the Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepository
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "frontal-sdk-${RELEASE_TAG}.spdx.json" --clobber
      - name: Attest published SDK artifacts and SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            sdk/build/libs/frontal-sdk-*.jar
            frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
          sbom-path: frontal-sdk-${{ env.RELEASE_TAG }}.spdx.json
